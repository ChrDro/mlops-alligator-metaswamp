# Alertmanager configuration.
#
# Scope for now: wire up the Prometheus -> Alertmanager pipeline only.
# Firing alerts are grouped, deduplicated and routed here; you can see them
# in the Alertmanager UI at http://localhost:9093. No external notifier is
# configured yet -- the default receiver below is intentionally empty ("null"),
# so alerts arrive at Alertmanager but are not forwarded anywhere.
#
# To add real notifications later, give the receiver a notifier config. Keep
# any secret (Slack webhook URL, SMTP password) OUT of git -- use the *_file
# options and mount a git-ignored secret file. Examples:
#
#   receivers:
#     - name: default
#       slack_configs:
#         - api_url_file: /etc/alertmanager/secrets/slack_url
#           channel: "#alerts"
#           send_resolved: true
#
#   receivers:
#     - name: default
#       email_configs:
#         - to: team@example.com
#           from: alertmanager@example.com
#           smarthost: smtp.example.com:587
#           auth_username: alertmanager@example.com
#           auth_password_file: /etc/alertmanager/secrets/smtp_password

route:
  # Group alerts that share these labels into a single notification.
  group_by: ['alertname', 'severity']
  # Wait a moment to collect other alerts in the same group before sending.
  group_wait: 30s
  # Wait before sending an update about new alerts added to a group.
  group_interval: 5m
  # Re-send an already-firing alert after this long if it is still active.
  repeat_interval: 3h
  receiver: default

receivers:
  # Null receiver: alerts route here and show up in the Alertmanager UI,
  # but nothing is sent out. Replace with slack_configs / email_configs above.
  - name: default
