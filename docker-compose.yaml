services:
  model-service:
    build:
      context: webservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./mlruns:${PWD}/mlruns
    networks:
      - ml-services-monitoring

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yaml
    networks:
      - ml-services-monitoring

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ml-services-monitoring

  evidently_service:
    build:
      context: evidently_service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    networks:
      - ml-services-monitoring

  prefect:
    image: prefecthq/prefect:3.6.25-python3.11
    command:
      - /bin/sh
      - -lc
      - |
        pip install --no-cache-dir asyncpg==0.31.0 && \
        prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    networks:
      - ml-services-monitoring

volumes:
  grafana-data:
  prometheus-data:

networks:
  ml-services-monitoring:
    driver: bridge
