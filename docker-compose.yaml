services:
  model-service:
    build:
      context: webservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # boto3 needs these to download model artifacts from MinIO when resolving
      # models:/...@dev. Inside the Docker network the endpoint is minio:9000.
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=eu-central-1
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      #  POST /events/new-data needs the REST endpoint set
      - PREFECT_API_URL=http://prefect:4200/api
    volumes:
      # Fixed container path on purpose: ${PWD} here made the target depend on the
      # host shell, and Git Bash rewrites it to C:/... which compose then reads as
      # extra colons in the volume spec.
      - ./mlruns:/app/mlruns
    networks:
      - ml-services-monitoring

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yaml
    networks:
      - ml-services-monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - ml-services-monitoring

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_USERS_DEFAULT_THEME=light
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
      - ./grafana/img/grafana_icon.svg:/usr/share/grafana/public/img/grafana_icon.svg:ro
      - ./grafana/img/grafana_icon.svg:/usr/share/grafana/public/build/img/grafana_icon.svg:ro
      - ./grafana/img/grafana_icon.svg:/usr/share/grafana/public/build/static/img/grafana_icon.1e0deb6b.svg:ro
      - ./grafana/img/fav32.png:/usr/share/grafana/public/img/fav32.png:ro
      - ./grafana/img/apple-touch-icon.png:/usr/share/grafana/public/img/apple-touch-icon.png:ro
      - ./grafana/img/mstile-150x150.png:/usr/share/grafana/public/img/mstile-150x150.png:ro
    depends_on:
      - prometheus
    networks:
      - ml-services-monitoring

  evidently_service:
    build:
      context: evidently_service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    networks:
      - ml-services-monitoring

  prefect:
    image: prefecthq/prefect:3.6.25-python3.11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Ordering only, deliberately not service_healthy: the Prefect server is
      # worth having even when Trino is down, and its own startup (pip install
      # below) takes far longer than Trino needs to accept queries anyway.
      trino:
        condition: service_started
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=http://localhost:4200/api
      - MODEL_API_URL=http://model-service:8080
      - TRINO_IP_ADDRESS=trino
      # Persist server state in Postgres instead of SQLite in the container
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
    volumes:
      - ./prefect:/opt/flows
      # Read-only: model_quality_backtest.py replays the labelled holdout rows in
      # data/holdouts/ (one CSV per monitored model). Nothing in prefect/ writes
      # to this directory.
      - ./data:/opt/data:ro
    working_dir: /opt/flows
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        pip install --no-cache-dir \
          asyncpg==0.31.0 \
          "sqlalchemy>=2.0.51" "trino[sqlalchemy]>=0.338.0" \
          "pandas>=2.0.0,<3.0.0" python-dotenv requests
        python ensure_database.py
        prefect server start --host 0.0.0.0 &
        echo "Waiting for the Prefect API to come up..."
        until python -c "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')" 2>/dev/null; do
          sleep 2
        done
        echo "API is up - registering streaming deployments."
        exec python serve_flows.py
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      # Lets pip install above finish before the server starts.
      start_period: 300s
    networks:
      - ml-services-monitoring

  minio:
    image: minio/minio:latest
    container_name: mlflow_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_LICENSE: "on"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # Start the server in the background, wait until it responds, create the
    # buckets (idempotent), then hand control back to the server process so it
    # stays the container's long-running process. mc ships inside minio/minio,
    # so no separate bootstrap container is needed.
    entrypoint:
      - /bin/sh
      - -c
      - |
        minio server /data --console-address ":9001" &
        minio_pid=$$!
        until mc alias set myminio http://localhost:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" 2>/dev/null; do
          echo "Waiting for MinIO to accept connections...";
          sleep 1;
        done
        mc mb --ignore-existing myminio/mlflow
        mc mb --ignore-existing myminio/postgres-backups
        # Iceberg warehouse for the Trino/Nessie catalog
        mc mb --ignore-existing myminio/warehouse
        echo "MinIO buckets ready."
        wait "$$minio_pid"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - ml-services-monitoring

  postgres:
    image: postgres:15-alpine
    container_name: mlflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - ml-services-monitoring

  postgres_backup:
    image: eeshugerman/postgres-backup-s3:15
    container_name: mlflow_postgres_backup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=postgres-backups
      - S3_ENDPOINT=http://minio:9000
      - S3_S3V4=yes
      - S3_PREFIX=mlflow_db_backups
      - S3_REGION=eu-central-1
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_DATABASE=${POSTGRES_DB}
      - SCHEDULE=@hourly
      - BACKUP_KEEP_DAYS=30
    networks:
      - ml-services-monitoring

  # Second backup instance for Prefect's own database.
  # The image dumps exactly one database per container
  prefect_postgres_backup:
    image: eeshugerman/postgres-backup-s3:15
    container_name: prefect_postgres_backup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      prefect:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=postgres-backups
      - S3_ENDPOINT=http://minio:9000
      - S3_S3V4=yes
      - S3_PREFIX=prefect_db_backups
      - S3_REGION=eu-central-1
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=prefect
      - POSTGRES_DATABASE=prefect
      - SCHEDULE=@hourly
      # Shorter than MLflow's 30 days as database holds operational
      # telemetry (run history, logs, events),
      # not the system of record for models.
      - BACKUP_KEEP_DAYS=7
    networks:
      - ml-services-monitoring

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=eu-central-1
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      # MLflow 3.x rejects Host headers not in its allowlist (DNS-rebinding protection).
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow:*,localhost:*,127.0.0.1:*
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    networks:
      - ml-services-monitoring

  # Iceberg catalog for Trino
  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.5-java
    container_name: nessie_catalog
    ports:
      - "19120:19120"
    environment:
      # Store to outlive the container after docker compose down
      - NESSIE_VERSION_STORE_TYPE=ROCKSDB
      - NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH=/deployments/data/rocksdb
    volumes:
      - nessie_data:/deployments/data
    networks:
      - ml-services-monitoring

  trino:
    image: trinodb/trino:483
    container_name: trino
    depends_on:
      minio:
        condition: service_healthy
      nessie:
        condition: service_started
    environment:
      # Read by ${ENV:...} in etc/trino/catalog/iceberg.properties.
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # ... and by etc/config.properties. Kept out of that file so it stays
      # committable; the keystore itself is generated, never committed.
      - TRINO_SHARED_SECRET=${TRINO_SHARED_SECRET}
      - TRINO_KEYSTORE_PASSWORD=${TRINO_KEYSTORE_PASSWORD}
    ports:
      - "8443:8443"
    volumes:
      - ./trino-iceberg/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino-iceberg/etc/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino-iceberg/etc/trino/password.db:/etc/trino/password.db:ro
      - ./trino-iceberg/etc/keystore.jks:/etc/trino/keystore.jks:ro
      - ./trino-iceberg/etc/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./trino-iceberg/etc/trino/catalog/duckdb.properties:/etc/trino/catalog/duckdb.properties:ro
      - ./trino-iceberg/etc/trino/catalog/tpch.properties:/etc/trino/catalog/tpch.properties:ro
      - ./trino-iceberg/data:/duckdb
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ml-services-monitoring

volumes:
  grafana-data:
  prometheus-data:
  minio_data:
  postgres_data:
  nessie_data:

networks:
  ml-services-monitoring:
    driver: bridge
