services:
  model-service:
    build:
      context: webservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./mlruns:${PWD}/mlruns
    networks:
      - ml-services-monitoring

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yaml
    networks:
      - ml-services-monitoring

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ml-services-monitoring

  evidently_service:
    build:
      context: evidently_service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    networks:
      - ml-services-monitoring

  prefect:
    image: prefecthq/prefect:3.6.25-python3.11
    command:
      - /bin/sh
      - -lc
      - |
        pip install --no-cache-dir asyncpg==0.31.0 && \
        prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
  minio:
    image: minio/minio:latest
    container_name: mlflow_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - ml-services-monitoring

  mc:
    image: minio/mc:latest
    container_name: mlflow_init_bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/mlflow;
      /usr/bin/mc mb --ignore-existing myminio/postgres-backups;
      exit 0;
      "
    networks:
      - ml-services-monitoring

  postgres:
    image: postgres:15-alpine
    container_name: mlflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - ml-services-monitoring

  postgres_backup:
    image: eeshugerman/postgres-backup-s3:15
    container_name: mlflow_postgres_backup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=postgres-backups
      - S3_ENDPOINT=http://minio:9000
      - S3_S3V4=yes
      - S3_PREFIX=mlflow_db_backups
      - S3_REGION=eu-central-1
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_DATABASE=${POSTGRES_DB}
      - SCHEDULE=@hourly
      - BACKUP_KEEP_DAYS=30
    networks:
      - ml-services-monitoring

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=eu-central-1
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    networks:
      - ml-services-monitoring

volumes:
  grafana-data:
  prometheus-data:
  minio_data:
  postgres_data:

networks:
  ml-services-monitoring:
    driver: bridge
