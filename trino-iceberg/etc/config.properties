# Mounted over the image's own /etc/trino/config.properties, which means it
# replaces it rather than adding to it - the coordinator/discovery defaults from
# the image have to be repeated here or Trino refuses to start.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Every client (dbt, the SQLAlchemy engines in prefect/, src/check_trino_connection.py)
# talks HTTPS on 8443 with file-based password auth, see password-authenticator.properties.
# Port 8080 above stays plain HTTP for in-container discovery only and is not published.
http-server.authentication.type=PASSWORD
http-server.authentication.allow-insecure-over-http=false
http-server.https.enabled=true
http-server.https.port=8443
# Self-signed dev certificate (CN=trino). Clients connect with verify=False.
http-server.https.keystore.path=/etc/trino/keystore.jks

# ${ENV:...} is Trino's own substitution, so this file stays committable: the two
# secrets below come from .env through docker-compose.yaml. Generate the keystore
# they refer to with trino-iceberg/generate-dev-credentials.sh.
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
