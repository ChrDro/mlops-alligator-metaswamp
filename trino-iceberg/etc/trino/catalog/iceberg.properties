connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v1
iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/
iceberg.nessie-catalog.ref=main
fs.s3.enabled=true
# The single MinIO of the compose stack - the same one MLflow stores artifacts in.
# The warehouse bucket is created by MinIO's entrypoint in docker-compose.yaml.
s3.endpoint=http://minio:9000
s3.region=eu-central-1
s3.path-style-access=true
# ${ENV:...} is Trino's own substitution; the two variables are passed to the
# container from .env in docker-compose.yaml.
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
