column_mapping:
  categorical_features:
  - PULocationID
  - DOLocationID
  numerical_features:
  - trip_distance
  - passenger_count
  - fare_amount
  - total_amount
  target: duration
  prediction: prediction

service:
  calculation_period_sec: 10
  min_reference_size: 20000
  moving_reference: false
  reference_path: ./green_taxi_data/reference.csv
  use_reference: true
  window_size: 60
  monitors:
  - data_drift