# Docker-out-of-Docker launcher for docker-compose.yaml.
#
# This container runs the `docker compose` CLI against the *host's* Docker
# daemon through the mounted socket. The services it starts are therefore
# siblings of this container on the host, not nested children: they publish
# their ports on the host and share its image cache exactly as a plain
# `docker compose up` would. Nothing runs a second Docker daemon.
#
# Drive it through scripts/run_stack_in_container.sh, which resolves the socket
# path for the active Docker context and exports the variables below.
#
#   PROJECT_DIR    absolute path of the repo root as the daemon sees it
#                  (the host path on macOS and Linux, /mnt/<drive>/... under
#                  Docker Desktop for Windows) - required
#   DOCKER_SOCKET  Docker socket to mount (default /var/run/docker.sock)

services:
  stack-launcher:
    image: docker:28-cli # ships the compose v2 plugin, no extra install needed
    # The project has to sit at the same absolute path in here as the daemon
    # uses for it. docker-compose.yaml has relative bind mounts (./mlruns,
    # ./prometheus, ./grafana, ./data), which compose resolves to absolute paths
    # in *this* container but which the *host* daemon then mounts. Mounted
    # anywhere else, the daemon would look up paths that do not exist on the
    # host and Prometheus, Alertmanager and Grafana would start on empty
    # directories. run_stack_in_container.sh probes this before starting.
    working_dir: ${PROJECT_DIR:?run scripts/run_stack_in_container.sh instead of invoking this file directly}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${PROJECT_DIR}:${PROJECT_DIR}
    environment:
      # Pin the inner project name. It would otherwise be derived from the
      # directory name, and any mismatch with a stack started from the host
      # would silently create a second one with its own volumes and databases.
      - COMPOSE_PROJECT_NAME=mlops-alligator-metaswamp
    # Overridden by the wrapper script whenever it is given arguments.
    command: docker compose up -d --build
